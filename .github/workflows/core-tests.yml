# Runs the game-rules tests (inventory, crafting, gathering, building, network protocol), then
# builds the game server and has 20 bots play on it for a few seconds. Plain C# with no Unity in
# it, so it runs in a minute and needs no licence.

name: Core tests

on:
  push:
    paths:
      - 'Assets/Oxfall/Scripts/Core/**'
      - 'tests/**'
      - 'server/**'
      - 'tools/servertest/**'
      - '.dockerignore'
      - 'render.yaml'
      - '.github/workflows/core-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the rules
        run: dotnet test tests/Oxfall.Core.Tests --nologo
      - name: Build the server
        run: dotnet publish server/Oxfall.Server -c Release -o out/server --nologo
      - name: Bots on the server
        run: |
          dotnet out/server/Oxfall.Server.dll > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:7777/ && break; sleep 1; done
          node tools/servertest/bots.js ws://localhost:7777/ws 20 6
          echo; tail -n 5 server.log
      - name: Server container builds
        run: docker build -q -f server/Dockerfile -t oxfall-server .
