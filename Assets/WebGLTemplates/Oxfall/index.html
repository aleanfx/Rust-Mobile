<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
  <meta name="theme-color" content="#0d1114">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0d1114; color: #e8e4dc; overflow: hidden;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* The canvas stays clear of the notch, the rounded corners and the home bar: the game cannot
       see the browser's safe area, so the page keeps the whole canvas inside it. */
    #unity-canvas {
      position: fixed;
      left: env(safe-area-inset-left, 0px); top: env(safe-area-inset-top, 0px);
      width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; background: #0d1114; touch-action: none; outline: none;
    }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #0d1114;
      z-index: 2;
    }
    #loader .title { font-size: 34px; font-weight: 800; letter-spacing: 0.32em; color: #d9b98a; }
    #loader .bar { width: min(60vw, 360px); height: 6px; border-radius: 3px; background: #26303a; overflow: hidden; }
    #loader .fill { width: 0; height: 100%; background: #d9b98a; transition: width 0.2s; }
    #loader .status { font-size: 14px; color: #9aa4ad; text-align: center; padding: 0 24px; }
    #rotate {
      position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; background: #0d1114; z-index: 3; font-size: 18px;
      text-align: center; padding: 24px;
    }
    #rotate .icon { font-size: 56px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <div class="title">OXFALL</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Cargando la isla…</div>
  </div>
  <div id="rotate"><div class="icon">⟳</div><div>Gira el teléfono en horizontal para jugar</div></div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var fill = document.getElementById("fill");
    var statusText = document.getElementById("status");
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

    // Phones render at most 1.5 pixels per CSS pixel: a 3x iPhone screen at full density costs
    // four times the pixels for little visible gain. The game's own render scale lowers it further.
    var pixelRatio = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: pixelRatio,
      showBanner: function (message, type) {
        console.log("[Unity " + type + "] " + message);
        if (type === "error") statusText.textContent = "Error: " + message;
      },
    };

    // Stop the page from scrolling, zooming or showing the iOS callout while playing.
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        document.getElementById("loader").remove();
        console.log("[Oxfall] web player started");
      }).catch(function (message) {
        statusText.textContent = "No se pudo iniciar: " + message;
        console.error("[Oxfall] start failed: " + message);
      });
    };
    script.onerror = function () { statusText.textContent = "No se pudo descargar el juego."; };
    document.body.appendChild(script);
  </script>
</body>
</html>
